<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

    <h1>Detection Logs</h1>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>URL</th>
            <th>Result</th>
            <th>Time</th>
        </tr>

        {% for row in logs %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
