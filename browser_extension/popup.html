<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; font-family: 'Segoe UI', sans-serif; background: #050816; color: #fff; padding: 16px; margin: 0; }
        h2 { font-size: 14px; color: #38bdf8; margin: 0 0 12px; }
        .status { padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .safe { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
        .phishing { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
        button { width: 100%; padding: 10px; background: #38bdf8; color: #050816; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        button:hover { background: #7dd3fc; }
        .info { font-size: 11px; color: #94a3b8; margin-top: 10px; }
        #result { font-size: 12px; }
    </style>
</head>
<body>
    <h2><i>🛡️ AI Phishing Detection</i></h2>
    <div id="result"><div class="status safe">Monitoring active — browse normally.</div></div>
    <button id="scanNow">Scan Current Page Now</button>
    <button id="openDashboard" style="background:#1e293b;color:#38bdf8;border:1px solid #38bdf8;">Open Dashboard</button>
    <p class="info">Automatic scans run every 30 seconds. Flask backend: localhost:5000</p>
    <script src="popup.js"></script>
</body>
</html>
